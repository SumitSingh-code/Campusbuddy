<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    /* Dark theme is default — apply before render to prevent flash */
    (function(){
      var t = localStorage.getItem('unigram_theme');
      /* Apply dark unless user explicitly chose light */
      if (t !== 'light') {
        document.documentElement.setAttribute('data-theme','dark');
        if (!t) localStorage.setItem('unigram_theme','dark');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Unigram — your campus social hub. Feed, DMs, PYQs, notices, timetable, notes &amp; more.">
  <title>Unigram</title>
  <meta name="theme-color" content="#0D1424">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">

  <!-- Splash screen CSS — MUST be in <head> so it applies before HTML renders -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #0D1424;
      transition: opacity .4s ease, visibility .4s ease;
      will-change: opacity;
    }
    #splash.sp-hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .sp-bg {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(212,175,55,0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 25% 75%, rgba(212,175,55,0.05) 0%, transparent 50%);
    }
    .sp-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
    }
    /* Logo */
    .sp-logo-wrap {
      position: relative; width: 88px; height: 88px; margin-bottom: 1.25rem;
    }
    .sp-logo {
      width: 88px; height: 88px; border-radius: 22px; display: block;
      animation: sp-pulse 2.2s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes sp-pulse {
      0%,100% { transform: scale(1);    box-shadow: 0 0 0  0   rgba(212,175,55,.45), 0 8px 28px rgba(0,0,0,.6); }
      50%      { transform: scale(1.05); box-shadow: 0 0 0  14px rgba(212,175,55,0),  0 12px 36px rgba(0,0,0,.4); }
    }
    .sp-ring {
      position: absolute; inset: -10px; border-radius: 30px;
      border: 1.5px solid rgba(212,175,55,.3);
      animation: sp-ring 2.2s ease-in-out infinite;
    }
    @keyframes sp-ring {
      0%,100% { transform: scale(1);    opacity: .4; }
      50%      { transform: scale(1.09); opacity: 1; }
    }
    /* Wordmark */
    .sp-wordmark {
      display: flex; gap: 0px; margin-bottom: .2rem;
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      font-size: 2.1rem; font-weight: 800; letter-spacing: -.04em; color: #fff;
    }
    .sp-wordmark span {
      display: inline-block;
      opacity: 0; transform: translateY(12px);
      animation: sp-up .45s cubic-bezier(.22,1,.36,1) both;
      animation-delay: calc(0.055s * var(--i) + 0.15s);
    }
    @keyframes sp-up {
      to { opacity: 1; transform: translateY(0); }
    }
    /* Caption */
    .sp-caption {
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      font-size: .6rem; font-weight: 700; letter-spacing: .22em;
      color: #D4AF37; text-transform: uppercase; margin-bottom: 2.25rem;
      opacity: 0;
      animation: sp-up .35s ease both .65s;
    }
    /* Wave bars */
    .sp-wave { display: flex; align-items: flex-end; gap: 5px; height: 30px; }
    .sp-bar {
      width: 5px; height: 6px; border-radius: 3px;
      background: linear-gradient(180deg, #f0c828 0%, #D4AF37 100%);
      animation: sp-wave 1.2s ease-in-out infinite;
      animation-delay: calc(0.13s * var(--d));
    }
    @keyframes sp-wave {
      0%,100% { height: 5px;  opacity: .35; }
      50%      { height: 26px; opacity: 1;   }
    }
  </style>
</head>

  <script type="module">
    import Auth from '/js/auth.js';
    import Router from '/js/router.js';
    import { initRealtime } from '/js/realtime.js';
    import { showToast, updateNavActive, fmtNum } from '/js/utils.js';

    // ── PWA Service Worker ────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err =>
          console.warn('[SW] Registration failed:', err)
        );
      });
    }

    // ── Auth init ─────────────────────────────────────────────────────────────
    async function init() {
      const { user, profile } = await Auth.init();

      if (!user || !profile) {
        window.location.href = '/auth.html';
        return;
      }

      // Redirect non-active users to auth page
      if (!['active','suspended'].includes(profile.status)) {
        window.location.href = '/auth.html';
        return;
      }

      // Forced password change
      if (profile.must_change_password && !Auth.isGoogleOnly()) {
        window.location.href = '/auth.html';
        return;
      }

      // Reveal app — fade splash out, fade app in
      const splash = document.getElementById('splash');
      const app    = document.getElementById('app');
      app.style.display = '';
      app.style.opacity = '0';
      app.style.transition = 'opacity .4s ease';
      splash.classList.add('sp-hide');
      setTimeout(() => {
        splash.style.display = 'none';
        app.style.opacity = '1';
      }, 420);



      // Populate avatar
      const initials = (profile.full_name || '?').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
      const avatarEl = document.getElementById('nav-avatar');
      if (avatarEl) avatarEl.textContent = initials;



      // Nav click handlers (both mobile bottom nav and desktop nav links)
      function makeNavHandler(route) {
        return (e) => {
          e.preventDefault();
          document.getElementById('more-menu').style.display = 'none';
          window.location.hash = `#${route}`;
        };
      }

      // Mobile nav
      document.querySelectorAll('.nav-item[data-route], .nav-link[data-route]').forEach(el => {
        el.addEventListener('click', makeNavHandler(el.dataset.route));
      });

      // More menu nav items
      document.querySelectorAll('.modal__body [data-route]').forEach(el => {
        el.addEventListener('click', makeNavHandler(el.dataset.route));
      });

      // Desktop profile button → toggle dropdown
      const avatarDropdown = document.getElementById('nav-avatar-dropdown');
      document.getElementById('nav-top-profile')?.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = avatarDropdown.style.display !== 'none';
        avatarDropdown.style.display = open ? 'none' : 'block';
        document.getElementById('nav-top-profile').setAttribute('aria-expanded', String(!open));
      });
      document.getElementById('nav-dd-profile')?.addEventListener('click', () => {
        avatarDropdown.style.display = 'none';
        window.location.hash = '#/profile';
      });
      document.getElementById('nav-dd-signout')?.addEventListener('click', async () => {
        avatarDropdown.style.display = 'none';
        await Auth.signOut();
      });
      // Close dropdown on outside click
      document.addEventListener('click', (e) => {
        if (!document.getElementById('nav-avatar-wrap')?.contains(e.target)) {
          avatarDropdown.style.display = 'none';
          document.getElementById('nav-top-profile')?.setAttribute('aria-expanded', 'false');
        }
      });


      // Sign out
      document.getElementById('btn-sign-out').addEventListener('click', async () => {
        await Auth.signOut();
      });

      // Close more menu on overlay click
      document.getElementById('more-menu').addEventListener('click', (e) => {
        if (e.target.id === 'more-menu') document.getElementById('more-menu').style.display = 'none';
      });
      document.getElementById('close-more-menu').addEventListener('click', () => {
        document.getElementById('more-menu').style.display = 'none';
      });
      // Open more-menu from bottom nav "More" button
      document.getElementById('nav-more')?.addEventListener('click', () => {
        document.getElementById('more-menu').style.display = 'flex';
        document.body.style.overflow = 'hidden';
      });
      // Close more-menu when a route button inside it is tapped
      document.getElementById('more-menu').querySelectorAll('[data-route]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('more-menu').style.display = 'none';
          document.body.style.overflow = '';
        });
      });


      // Initialize realtime subscriptions
      initRealtime(user.id, {
        onNotification: (notif) => {
          // Notification bell is currently hidden — only handle DM toasts
          if (notif.type === 'dm') {
            showToast('New message received', 'info', 3000);
            _updateBadge('dm-badge', _getCount('dm-badge') + 1);
            _updateBadge('dm-badge-top', _getCount('dm-badge-top') + 1);
          }
        },
        onMessage: () => {
          // Handled by notification trigger
        },
      });

      // Initialize router
      Router.init();

      // ── Keepalive ping ──────────────────────────────────────────────────
      // Vercel free tier cold-starts functions after ~5min of inactivity,
      // adding 600-1500ms to the first request. Pinging /api/health every
      // 4 minutes keeps the function warm at zero cost.
      // Only fires when the tab is visible so background tabs don't waste quota.
      (function _startKeepalive() {
        const PING_INTERVAL = 4 * 60 * 1000; // 4 minutes
        let _pingTimer = null;
        function _ping() {
          if (document.visibilityState !== 'hidden') {
            fetch('/api/health', { method: 'GET', credentials: 'omit' }).catch(() => {});
          }
        }
        function _schedule() {
          clearInterval(_pingTimer);
          _pingTimer = setInterval(_ping, PING_INTERVAL);
        }
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') { _ping(); _schedule(); }
          else clearInterval(_pingTimer);
        });
        _schedule();
      })();
    }

    function _getCount(id) {
      const el = document.getElementById(id);
      return el ? (parseInt(el.textContent) || 0) : 0;
    }

    function _updateBadge(id, count) {
      const el = document.getElementById(id);
      if (!el) return;
      if (count > 0) {
        el.textContent = count > 99 ? '99+' : String(count);
        el.style.display = 'flex';
      } else {
        el.style.display = 'none';
      }
    }

    // ── Notify count reset on nav to section ─────────────────────────────────
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash;
      if (hash === '#/notifications') { window.location.hash = '/feed'; } // notifications hidden — redirect
      if (hash === '#/dm')            { _updateBadge('dm-badge', 0);    _updateBadge('dm-badge-top', 0); }
    });

    init().catch(err => {
      console.error('[App] Init error:', err);
      window.location.href = '/auth.html';
    });
  </script>
</body>
</html>
